
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e9f5ff, #f2edff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(45, 55, 100, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 40px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #27346a;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            background: #f0f2fa;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tabs button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: transparent;
            color: #777;
        }

        .tabs button.active {
            background: #4f46e5;
            color: white;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dce0ed;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #3730a3;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #eafaf0;
            color: #18743b;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">📚</div>

        <h1>AI Study Buddy</h1>

        <p class="subtitle">
            Your personal learning companion.<br>
            Learn smarter, one step at a time.
        </p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active">
                Login
            </button>

            <button type="button" id="registerTab">
                Register
            </button>
        </div>

        <form id="authForm">

            <div class="form-group" id="nameGroup" hidden>
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Login
            </button>

        </form>

        <div class="message" id="message"></div>

        <p class="footer">
            AI Study Buddy &copy; 2026
        </p>

    </div>

    <script>
        const API_URL = "http://localhost:5000/api/auth";

        const authForm = document.getElementById("authForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const nameGroup = document.getElementById("nameGroup");
        const nameInput = document.getElementById("name");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        let currentMode = "login";

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function setMode(mode) {
            currentMode = mode;

            const isRegister = mode === "register";

            loginTab.classList.toggle("active", !isRegister);
            registerTab.classList.toggle("active", isRegister);

            nameGroup.hidden = !isRegister;
            nameInput.required = isRegister;

            passwordInput.autocomplete =
                isRegister ? "new-password" : "current-password";

            submitBtn.textContent =
                isRegister ? "Create Account" : "Login";

            message.className = "message";
            message.textContent = "";
        }

        loginTab.addEventListener("click", () => {
            setMode("login");
        });

        registerTab.addEventListener("click", () => {
            setMode("register");
        });

        authForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password = passwordInput.value;

            const payload = {
                email: email,
                password: password
            };

            if (currentMode === "register") {
                payload.name = nameInput.value.trim();

                if (!payload.name) {
                    showMessage("Please enter your name.", "error");
                    return;
                }
            }

            const endpoint =
                currentMode === "register" ? "/register" : "/login";

            submitBtn.disabled = true;
            submitBtn.textContent = "Please wait...";

            try {
                const response = await fetch(
                    API_URL + endpoint,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Authentication failed."
                    );
                }

                if (currentMode === "register") {
                    showMessage(
                        "Registration successful! Please login.",
                        "success"
                    );

                    setMode("login");
                    passwordInput.value = "";
                } else {
                    if (!data.accessToken) {
                        throw new Error(
                            "Access token missing from server response."
                        );
                    }

                    localStorage.setItem(
                        "accessToken",
                        data.accessToken
                    );

                    if (data.refreshToken) {
                        localStorage.setItem(
                            "refreshToken",
                            data.refreshToken
                        );
                    }

                    showMessage(
                        "Login successful! Opening dashboard...",
                        "success"
                    );

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                }

            } catch (error) {
                showMessage(
                    error.message === "Failed to fetch"
                        ? "Cannot connect to server. Please check whether your backend is running."
                        : error.message,
                    "error"
                );
            } finally {
                submitBtn.disabled = false;

                submitBtn.textContent =
                    currentMode === "register"
                        ? "Create Account"
                        : "Login";
            }
        });
    </script>

</body>
</html>
